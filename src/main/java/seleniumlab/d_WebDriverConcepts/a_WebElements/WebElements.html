<style>
.web-element-playground {
    max-width: 650px;
    padding: 20px;
    border: 1px solid #ddd;
    border-radius: 8px;
}

.practice-field {
    margin-bottom: 15px;

}
.names{
    display: flex;
    gap: 10px;
}

.practice-field label {
    display: block;
    margin-bottom: 5px;
    font-weight: 500;
}

.text-box,
.text-area,
.number-box,
.date-box,
.select-box {
    padding: 5px;
    border: 1px solid #999;
    border-radius: 5px;
}

.text-box,
.text-area {
    width: 300px;
}

.text-area {
    height: 80px;
}

.practice-button {
    padding: 10px 20px;
    border: 1px solid #999;
    border-radius: 5px;
    background: #eee;
    cursor: pointer;
}

.practice-button:hover {
    background: #ddd;
}

.practice-link {
    display: inline-block;
    margin-top: 10px;
}

.practice-group {
    margin-bottom: 15px;
}

.practice-image {
    width: 150px;
}

</style>
        
<div class="web-element-playground">
    <h3>WebElements Playground</h3>
    <!-- Text Box -->
     <div class="names">
        <div class="practice-field">
        <label>First Name</label>
        <input
            id="firstName"
            name="firstName"
            type="text"
            class="text-box"
            placeholder="Enter first name">
    </div>
    <!-- Password -->
    <div class="practice-field">
        <label>Password</label>
        <input
            id="password"
            name="password"
            type="password"
            class="text-box"
            placeholder="Enter password">
    </div>
     </div>
    <!-- Textarea -->
    <div class="practice-field">
        <label>Comments</label>
        <textarea
            id="comments"
            name="comments"
            class="text-area"
            placeholder="Enter your comments"></textarea>
    </div>
    <!-- Number -->
    <div class="practice-field">
        <label>Age</label>
        <input
            id="age"
            name="age"
            type="number"
            class="number-box"
            min="1"
            max="100"
            value="25">
    </div>
    <!-- Date -->
    <div class="practice-field">
        <label>Date of Birth</label>
        <input
            id="dob"
            name="dob"
            type="date"
            class="date-box">
    </div>
    <!-- File -->
    <div class="practice-field">
        <label>Upload File</label>
        <input
            id="document"
            name="document"
            type="file">
    </div>
    <!-- Button -->
    <div class="practice-field">
        <button
            id="submitButton"
            name="submit"
            type="button"
            class="practice-button">
            Submit
        </button>
        <p id="successMessage" style="display:none;">Form submitted successfully!</p>
    </div>
    <!-- Disabled Button -->
    <div class="practice-field">
        <button
            id="disabledButton"
            type="button"
            class="practice-button"
            disabled>
            Disabled Button
        </button>
    </div>
    <!-- Link -->
    <div class="practice-field">
        <a
            id="seleniumLink"
            href="https://www.selenium.dev/"
            target="_blank"
            class="practice-link">
            Visit Selenium Website
        </a>
    </div>
    <!-- Image -->
    <div class="practice-field">
        <img
            id="practiceImage"
            class="practice-image"
            src="https://www.selenium.dev/images/selenium_logo_square_green.svg"
            alt="Selenium Logo">
    </div>
    <!-- Text -->
    <h3 id="practiceHeading">
        Practice Heading
    </h3>
    <p id="practiceText">
        This is sample text for practicing getText().
    </p>

</div>
<script>
    document.getElementById("submitButton").addEventListener("click", function () {
        document.getElementById("successMessage").style.display = "block";
    });
</script>
