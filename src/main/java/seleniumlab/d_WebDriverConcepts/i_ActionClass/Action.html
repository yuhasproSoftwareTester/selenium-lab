<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Selenium Actions Playground</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: white;
        }

        .actions-playground {
            max-width: 650px;
            padding: 18px;

            border: 1px solid #ddd;
            border-radius: 8px;

            box-sizing: border-box;
        }

        .actions-playground h2 {
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 22px;
        }

        .section {
            padding: 14px 0;
            border-bottom: 1px solid #eee;
        }

        .section:last-child {
            border-bottom: none;
        }

        .section-title {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 10px;
        }

        /* =================================
           SMALL ACTION BUTTONS
        ================================= */

        .action-button {
            display: inline-block;

            padding: 7px 12px;
            margin: 3px;

            border: none;
            border-radius: 4px;

            background: #1976d2;
            color: white;

            cursor: pointer;
            font-size: 13px;
        }

        .action-button:hover {
            background: #1565c0;
        }

        /* =================================
           HOVER / CLICK ELEMENTS
        ================================= */

        .hover-box,
        .click-box {

            display: inline-flex;

            align-items: center;
            justify-content: center;

            width: 150px;
            height: 45px;

            margin: 3px;

            border-radius: 5px;

            background: #f3f3f3;

            border: 1px solid #ccc;

            font-size: 13px;

            cursor: pointer;
        }

        .hover-box:hover {
            background: #e0e0e0;
        }

        /* =================================
           DRAG AND DROP
        ================================= */

        .drag-area {

            display: flex;

            align-items: center;
            gap: 25px;

            margin-top: 10px;
        }

        .drag-box,
        .drop-box {

            width: 110px;
            height: 65px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 5px;

            font-size: 13px;

            text-align: center;
        }

        .drag-box {

            background: #f3f3f3;

            border: 1px solid #999;

            cursor: grab;
        }

        .drop-box {

            background: #fafafa;

            border: 2px dashed #999;
        }

        /* =================================
           SLIDER
        ================================= */

        .slider-container {
            display: flex;

            align-items: center;

            gap: 12px;

            margin-top: 8px;
        }

        .slider {

            width: 250px;

            cursor: pointer;
        }

        .slider-value {

            min-width: 35px;

            padding: 4px 7px;

            background: #f3f3f3;

            border-radius: 4px;

            text-align: center;

            font-size: 13px;
        }

        /* =================================
           KEYBOARD
        ================================= */

        .keyboard-input {

            width: 250px;

            padding: 7px 9px;

            border: 1px solid #999;

            border-radius: 4px;

            font-size: 13px;

            box-sizing: border-box;
        }

        /* =================================
           RESULT
        ================================= */

        .result {

            padding: 9px 12px;

            background: #f3f3f3;

            border-radius: 5px;

            font-size: 13px;

            min-height: 18px;
        }

    </style>

</head>


<body>


<div class="actions-playground">


    <h2>Actions Class Playground</h2>


    <!-- =================================
         MOUSE ACTIONS
    ================================= -->

    <div class="section">

        <div class="section-title">
            1. Mouse Actions
        </div>


        <div
            id="hoverBox"
            class="hover-box">

            Hover Over Me

        </div>


        <div
            id="clickBox"
            class="click-box">

            Click Me

        </div>


        <div
            id="doubleClickBox"
            class="click-box">

            Double Click Me

        </div>


        <div
            id="rightClickBox"
            class="click-box">

            Right Click Me

        </div>

    </div>


    <!-- =================================
         DRAG AND DROP
    ================================= -->

    <div class="section">

        <div class="section-title">
            2. Drag and Drop
        </div>


        <div class="drag-area">


            <div
                id="dragSource"
                class="drag-box"
                draggable="true">

                Drag Me

            </div>


            <div
                id="dropTarget"
                class="drop-box">

                Drop Here

            </div>


        </div>

    </div>


    <!-- =================================
         CLICK AND HOLD
    ================================= -->

    <div class="section">

        <div class="section-title">
            3. Click and Hold
        </div>


        <button
            id="holdButton"
            class="action-button">

            Click and Hold Me

        </button>

    </div>


    <!-- =================================
         SLIDER
    ================================= -->

    <div class="section">

        <div class="section-title">
            4. Slider
        </div>


        <div class="slider-container">


            <input
                id="volumeSlider"
                class="slider"
                type="range"
                min="0"
                max="100"
                value="50">


            <span
                id="sliderValue"
                class="slider-value">

                50

            </span>


        </div>

    </div>


    <!-- =================================
         KEYBOARD
    ================================= -->

    <div class="section">

        <div class="section-title">
            5. Keyboard Actions
        </div>


        <input
            id="keyboardInput"
            class="keyboard-input"
            type="text"
            placeholder="Type something here">


    </div>


    <!-- =================================
         RESULT
    ================================= -->

    <div class="section">

        <div class="section-title">
            Action Result
        </div>


        <div
            id="actionResult"
            class="result">

            Perform an action to see the result.

        </div>

    </div>


</div>


<script>


/* =========================================
   RESULT
========================================= */

function showResult(message) {

    document
        .getElementById("actionResult")
        .textContent = message;

}


/* =========================================
   HOVER
========================================= */

const hoverBox =
    document.getElementById("hoverBox");


hoverBox.addEventListener(
    "mouseenter",
    function () {

        hoverBox.textContent =
            "Hovered!";

        showResult(
            "Mouse moved over the element."
        );

    }
);


hoverBox.addEventListener(
    "mouseleave",
    function () {

        hoverBox.textContent =
            "Hover Over Me";

    }
);


/* =========================================
   CLICK
========================================= */

document
    .getElementById("clickBox")
    .addEventListener(
        "click",
        function () {

            showResult(
                "Click action performed."
            );

        }
    );


/* =========================================
   DOUBLE CLICK
========================================= */

document
    .getElementById("doubleClickBox")
    .addEventListener(
        "dblclick",
        function () {

            showResult(
                "Double-click action performed."
            );

        }
    );


/* =========================================
   RIGHT CLICK
========================================= */

document
    .getElementById("rightClickBox")
    .addEventListener(
        "contextmenu",
        function (event) {

            event.preventDefault();

            showResult(
                "Right-click action performed."
            );

        }
    );


/* =========================================
   DRAG AND DROP
========================================= */

const dragSource =
    document.getElementById("dragSource");

const dropTarget =
    document.getElementById("dropTarget");


dragSource.addEventListener(
    "dragstart",
    function (event) {

        event.dataTransfer.setData(
            "text/plain",
            "dragSource"
        );

    }
);


dropTarget.addEventListener(
    "dragover",
    function (event) {

        event.preventDefault();

    }
);


dropTarget.addEventListener(
    "drop",
    function (event) {

        event.preventDefault();

        dropTarget.textContent =
            "Dropped!";

        showResult(
            "Drag and drop completed."
        );

    }
);


/* =========================================
   CLICK AND HOLD
========================================= */

const holdButton =
    document.getElementById("holdButton");


holdButton.addEventListener(
    "mousedown",
    function () {

        showResult(
            "Mouse button is being held."
        );

    }
);


holdButton.addEventListener(
    "mouseup",
    function () {

        showResult(
            "Mouse button released."
        );

    }
);


/* =========================================
   SLIDER
========================================= */

const volumeSlider =
    document.getElementById("volumeSlider");

const sliderValue =
    document.getElementById("sliderValue");


volumeSlider.addEventListener(
    "input",
    function () {

        sliderValue.textContent =
            volumeSlider.value;

        showResult(
            "Slider value: " +
            volumeSlider.value
        );

    }
);


/* =========================================
   KEYBOARD
========================================= */

document
    .getElementById("keyboardInput")
    .addEventListener(
        "keydown",
        function (event) {

            showResult(
                "Key pressed: " +
                event.key
            );

        }
    );


</script>


</body>

</html>
