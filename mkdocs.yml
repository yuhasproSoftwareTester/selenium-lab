site_name: Selenium Lab
site_description: Selenium WebDriver and TestNG Learning Lab
docs_dir: src/main/java
theme:
  name: material

  features:
    - navigation.tabs
    - search.highlight
    - content.code.copy
    - navigation.footer

  palette:

    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night
        name: Switch to light mode

    # Manual light mode
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    # Manual dark mode
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night
        name: Switch to light mode

extra_css:
    - stylesheets/extra.css

plugins:
  - search
markdown_extensions:
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true
  - pymdownx.superfences
nav:
    - Home: index.md
    - Selenium:
        - Introduction: seleniumlab/a_Introduction/Lesson1.md
        - WebDriver: seleniumlab/b_WebDriver/Lesson1.md
